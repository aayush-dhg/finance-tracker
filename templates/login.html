<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Finance Tracker</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card">
            <span class="brand-mark" aria-hidden="true">F</span>
            <p class="eyebrow">Finance tracker</p>
            <h1>Welcome back</h1>
            <p class="login-copy">Sign in to access your dashboard.</p>

            <h2>Login</h2>

            {% for category, message in get_flashed_messages(with_categories=true) %}
                <p class="message {{ category }}" role="status">{{ message }}</p>
            {% endfor %}

            {% if error %}
                <p class="error" role="alert">{{ error }}</p>
            {% endif %}

            <form class="login-form" method="POST" action="{{ url_for('login') }}">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    maxlength="30"
                    autocomplete="username"
                    value="{{ username }}"
                    required
                >

                <label for="password">Password</label>
                <div class="password-control">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="12"
                        maxlength="128"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        class="password-toggle"
                        type="button"
                        aria-controls="password"
                        aria-pressed="false"
                        aria-label="Show password"
                    >Show</button>
                </div>

                <button class="button button-primary" type="submit">
                    Login
                </button>
            </form>

            <p class="auth-switch">
                New here? <a href="{{ url_for('register') }}">Create account</a>
            </p>
        </section>
    </main>
    <script src="{{ url_for('static', filename='password-toggle.js') }}"></script>
</body>
</html>
