<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Finance Tracker</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card">
            <span class="brand-mark" aria-hidden="true">F</span>
            <p class="eyebrow">Finance tracker</p>
            <h1>Create account</h1>
            <p class="login-copy">
                Start with a private, empty financial dashboard.
            </p>

            <h2>Account details</h2>

            {% if error %}
                <p class="error" role="alert">{{ error }}</p>
            {% endif %}

            <form class="login-form" method="POST" action="{{ url_for('register') }}">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    minlength="3"
                    maxlength="30"
                    pattern="[A-Za-z0-9_]+"
                    autocomplete="username"
                    value="{{ username }}"
                    aria-describedby="username-help"
                    required
                >
                <p class="field-help" id="username-help">
                    3–30 letters, numbers, or underscores. Saved in lowercase.
                </p>

                <label for="password">Password</label>
                <div class="password-control">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="12"
                        maxlength="128"
                        autocomplete="new-password"
                        aria-describedby="password-help"
                        required
                    >
                    <button
                        class="password-toggle"
                        type="button"
                        aria-controls="password"
                        aria-pressed="false"
                        aria-label="Show password"
                    >Show</button>
                </div>
                <p class="field-help" id="password-help">
                    Use 12–128 characters.
                </p>

                <label for="confirm-password">Confirm password</label>
                <div class="password-control">
                    <input
                        id="confirm-password"
                        name="confirm_password"
                        type="password"
                        minlength="12"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                    <button
                        class="password-toggle"
                        type="button"
                        aria-controls="confirm-password"
                        aria-pressed="false"
                        aria-label="Show password confirmation"
                    >Show</button>
                </div>

                <button class="button button-primary" type="submit">
                    Create account
                </button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </section>
    </main>
    <script src="{{ url_for('static', filename='password-toggle.js') }}"></script>
</body>
</html>
